<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Dashboard</title>

    <style>
        body { font-family: Arial; margin: 20px; }

        h1 { margin-bottom: 10px; }
        h2 { margin-top: 30px; }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th { background-color: #f2f2f2; }

        .positive { color: green; font-weight: bold; }
        .negative { color: red; font-weight: bold; }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            border: 1px solid #ccc;
            padding: 12px;
            width: 180px;
            border-radius: 8px;
            text-align: center;
        }

        form div {
            margin-bottom: 8px;
        }

        button {
            padding: 10px 16px;
            font-size:  15px;
            cursor: pointer;
            margin-right: 5px; /* ✅ ADDED */
        }
        
        /* ✅ tab buttons */
        button {
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #f5f5f5;
        }
        button:hover {
            background: #ddd;
        }

        input, select {
            padding: 5px;
            width:  100%;
        }
        /* ✅ Style Update */
        #accountSelect {
            width: 250px;
        }
                /* ✅ IMPROVEMENT for cleaner spacing */
        #selectedTags {
            margin-top: 8px;
        }
        /* ✅ SPACING BETWEEN TAGS (NEW) */
        #selectedTags span {
            margin: 4px;
            display: inline-block;
        }        
    </style>
</head>

<body>

<h1>📊 Portfolio Dashboard</h1>

<!-- ✅ TABS NAV -->
<div style="margin-bottom:15px;">
    <button onclick="showTab('dashboard', this)">📊 Dashboard</button>
    <button onclick="showTab('positions', this)">📦 Positions</button>
    <button onclick="showTab('activity', this)">📄 Activity</button>
</div>

<hr>



<!-- ✅ ACCOUNT FILTER -->
<form method="get" id="accountForm">
    <label><b>Account:</b></br>

    <!-- ✅ MULTI SELECT -->    
    <select id="accountSelect" name="account" multiple size="5">
        {% for acc in accounts %}
        <option value="{{ acc }}" {% if acc in selected_account %}selected{% endif %}>
            {{ acc }}
        </option>
        {% endfor %}
    </select>
    
    <br><br>

    <!-- ✅ ACTION BUTTONS -->
    <button type="button" onclick="selectAll()">Select All</button>
    <button type="button" onclick="clearSelection()">Clear</button>
    <button type="submit">Apply</button>

</form>

<!-- ✅ SELECTED TAGS -->
<div id="selectedTags" style="margin-top:10px;"></div>

<hr>


<!-- ✅ DASHBOARD TAB -->
<div id="dashboardTab">

<h2>Total Portfolio Value</h2>
<div style="font-size:28px; font-weight:bold;">
    ${{ "%.2f"|format(portfolio_value) }}
<hr>


</div>

<div class="{% if total_pnl >= 0 %}positive{% else %}negative{% endif %}">
    ${{ "%.2f"|format(total_pnl) }}
</div>

<h2>Account Performance</h2>

{% if account_performance %}
<table>
<tr>
    <th>Account</th>
    <th>P&L</th>
    <th>Return %</th>
</tr>
{% for acc in account_performance %}
<tr>
    <td>{{ acc.account }}</td>
    <td class="{% if acc.pnl >= 0 %}positive{% else %}negative{% endif %}">
        ${{ "%.2f"|format(acc.pnl) }}
    </td>
    <td class="{% if acc.pct >= 0 %}positive{% else %}negative{% endif %}">
        {{ "%.2f"|format(acc.pct) }}%
    </td>
</tr>
{% endfor %}
</table>
{% endif %}

<h2>Portfolio Balance</h2>
<div>{{ equity_chart|safe }}</div>



</div>

<div id="positionsTab">

<!-- ✅ POSITIONS -->
<h2>Positions</h2>

{% if positions %}
<table>
<tr>
    <th>Symbol</th>
    <th>Shares</th>
    <th>Price</th>
    <th>Avg Cost</th>
    <th>Value</th>
    <th>Unrealized P&L</th>
    <th>Unrealized %</th>
    <th>Allocation %</th>

</tr>

{% for p in positions %}
<tr>
    <td>{{ p.symbol }}</td>
    <td>{{ "%.2f"|format(p.shares) }}</td>
    <td>${{ "%.2f"|format(p.price) }}</td>
    <td>${{ "%.2f"|format(p.cost_basis) }}</td>
    <td>${{ "%.2f"|format(p.value) }}</td>
    
    <td class="{% if p.unrealized_pnl >= 0 %}positive{% else %}negative{% endif %}">
        ${{ "%.2f"|format(p.unrealized_pnl) }}

    </td>
    
    <td class="{% if p.unrealized_pct >= 0 %}positive{% else %}negative{% endif %}">
        {{ "%.2f"|format(p.unrealized_pct) }}%
    </td>
    
    <td>
        {{ "%.2f"|format(p.allocation_pct) }}%
    </td>

</tr>
{% endfor %}

</table>
{% else %}
<p>No open positions</p>
{% endif %}

<hr>

<h2>Portfolio Allocation</h2>
<div>
    {{ allocation_chart|safe }}
</div>

<div id="activityTab" style="display:none;">

 </div>
 
 <!-- ✅ ACTIVITY TAB -->
 <div id="activityTab" style="display:none;">

<!-- ✅ TRANSACTIONS -->
<h2>Transactions</h2>

{% if transactions %}
<table>
<tr>
    <th>Date</th>
    <th>Account</th>
    <th>Symbol</th>
    <th>Type</th>
    <th>Shares</th>
    <th>Price</th>
    <th>Amount</th>
    <th>Realized P&L</th>
    <th>Realized %</th>
    <th>Actions</th>
</tr>

{% for t in transactions %}
<tr>
    <td>{{ t.date.strftime('%Y-%m-%d') if t.date else '' }}</td>
    <td>{{ t.account }}</td>
    <td>{{ t.symbol }}</td>
    <td>{{ t.type }}</td>

    <td>{{ "%.2f"|format(t.shares) }}</td>
    <td>${{ "%.2f"|format(t.price) }}</td>
    <td>${{ "%.2f"|format(t.trade_amount) }}</td>

    <td class="{% if t.realized_pnl >= 0 %}positive{% else %}negative{% endif %}">
        ${{ "%.2f"|format(t.realized_pnl) }}
    </td>
    
    <td class="{% if t.realized_pct >= 0 %}positive{% else %}negative{% endif %}">
        {{ "%.2f"|format(t.realized_pct) }}%
    </td>

    <td>
        <a href="/edit/{{ t.id }}">Edit</a> |
        <a href="/delete/{{ t.id }}">Delete</a>
    </td>
</tr>
{% endfor %}
</table>

{% else %}
<p>No transactions yet.</p>
{% endif %}

<hr>

<!-- ✅ CASH TABLE -->
<h2>Cash Activity</h2>

{% if cash_flows %}
<table>
<tr>
    <th>Date</th>
    <th>Account</th>
    <th>Amount</th>
    <th>Description</th>
</tr>

{% for c in cash_flows %}
<tr>
    <td>{{ c.date.strftime('%Y-%m-%d') if c.date else '' }}</td>
    <td>{{ c.account }}</td>

    <td class="{% if c.amount >= 0 %}positive{% else %}negative{% endif %}">
        ${{ "%.2f"|format(c.amount) }}
    </td>

    <td>{{ c.description }}</td>
</tr>
{% endfor %}
</table>
{% else %}
<p>No cash activity</p>
{% endif %}
</div>
<hr>

<div>

<!-- ✅ JAVASCRIPT -->
<script>
function showTab(tab, btn=null) {
    document.getElementById("dashboardTab").style.display = "none";
    document.getElementById("positionsTab").style.display = "none";
    document.getElementById("activityTab").style.display = "none";

    document.getElementById(tab + "Tab").style.display = "block";

    localStorage.setItem("activeTab", tab);

    let buttons = document.querySelectorAll("button");
    buttons.forEach(b => b.style.background = "#f5f5f5");
	
    if (btn) {
        btn.style.background = "#333";
        btn.style.color = "white";
		
    }
}
	
function selectAll() {
    let select = document.getElementById("accountSelect");

    for (let i = 0; i < select.options.length; i++) {
        select.options[i].selected = true;
    }

    updateTags();
}

function clearSelection() {
    let select = document.getElementById("accountSelect");

    for (let i = 0; i < select.options.length; i++) {
        select.options[i].selected = false;
    }

    updateTags();
}
									  
function updateTags() {
    let select = document.getElementById("accountSelect");
    let container = document.getElementById("selectedTags");
    container.innerHTML = "";

    for (let i = 0; i < select.options.length; i++) {
        if (select.options[i].selected) {
            let val = select.options[i].value;
            let tag = document.createElement("span");
            tag.innerHTML = val + " ✕";
            tag.style = "background:#007bff;color:white;padding:5px 10px;border-radius:15px;margin:4px;cursor:pointer;";
            tag.onclick = function() {
			    select.options[i].selected = false;
				updateTags();
                document.getElementById("accountForm").submit();
            };
            container.appendChild(tag);
        }
    }
}
															
window.onload = function() {
    updateTags();
    let tab = localStorage.getItem("activeTab") || "dashboard";
    showTab(tab);
};

</script>

</body>
</html>
function openModal() {
    document.getElementById("modalOverlay").style.display = "flex";
}

function closeModal() {
    document.getElementById("modalOverlay").style.display = "none";
}

// ✅ Close if clicking outside modal
window.onclick = function(event) {
    var modal = document.getElementById("modalOverlay");
    if (event.target === modal) {
        modal.style.display = "none";
    }
}
</script>

<script>
function selectAll() {
    let select = document.getElementById("accountSelect");
    for (let i = 0; i < select.options.length; i++) {
        select.options[i].selected = true;
    }
    updateTags();
}

function clearSelection() {
    let select = document.getElementById("accountSelect");
    for (let i = 0; i < select.options.length; i++) {
        select.options[i].selected = false;
    }
    updateTags();
}

// ✅ show selected accounts as pills
function updateTags() {
    let select = document.getElementById("accountSelect");
    let container = document.getElementById("selectedTags");
    container.innerHTML = ""; // clear
    for (let i = 0; i < select.options.length; i++) {
        if (select.options[i].selected) {
            let value = select.options[i].value;            
            let tag = document.createElement("span");
            tag.innerHTML = value + " <b style='margin-left:5px; cursor:pointer;'>✕</b>";
            tag.style = `
                display:inline-block;
                background:#007bff;
                color:white;
                padding:5px 10px;
                border-radius:15px;
                margin:4px;
                font-size:12px;
                cursor:pointer;
            `;
            // ✅ remove selection on click
            tag.onclick = function() {
                for (let j = 0; j < select.options.length; j++) {
                    if (select.options[j].value === value) {
                        select.options[j].selected = false;
                    }
                }
                updateTags();
                document.getElementById("accountForm").submit();
            };
            container.appendChild(tag);
        }
    }
}

// ✅ update tags on change
document.getElementById("accountSelect").addEventListener("change", updateTags);

// ✅ initialize on page load to load last tab on page load
window.onload = function() {
    updateTags();
    let savedTab = localStorage.getItem("activeTab") || "dashboard";
    // trigger tab display
    showTab(savedTab);
};

</script>

<script>
function showTab(tab, btn=null) {
    // hide all tabs
    document.getElementById("dashboardTab").style.display = "none";
    document.getElementById("positionsTab").style.display = "none";
    document.getElementById("activityTab").style.display = "none";
    // show selected
    document.getElementById(tab + "Tab").style.display = "block";
    // ✅ save selection
    localStorage.setItem("activeTab", tab);
    // ✅ highlight active tab
    let buttons = document.querySelectorAll("div button");
    buttons.forEach(b => b.style.background = "#f5f5f5");
    if (btn) {
        btn.style.background = "#333";
        btn.style.color = "white";
    }
}
</script>

</body>
</html>
